<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Experiencias de aliento</title>
<style>
/* VOICE: calma, contemplativa
   IDEA: un objeto que vive del aliento
   PICTURE: el objeto a pantalla completa
   COLOUR and TYPE: fondo elegible, color elegible; sans ligera
   LAYOUT: lienzo completo; HUD mínimo; panel de ajustes abajo */
:root{--ink:#e8f1ff;--dim:#8fa3c4;--panel:rgba(5,11,24,.93);--line:#ffffff24;--chip:#ffffff14}
:root.claro{--ink:#14203a;--dim:#55637c;--line:#0000001f;--chip:#0000000d}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#050b18;color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:22px;min-height:44px;padding:0 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #9fe8ff;outline-offset:2px}
#hud{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px}
#estado{font-size:14px;color:var(--dim);text-align:center;min-height:20px}
.fila{display:flex;align-items:center;gap:10px}
.fila.botones{justify-content:space-between}
.medidor{flex:1;height:8px;border-radius:4px;background:var(--chip);position:relative}
#nivel{height:100%;width:0;background:linear-gradient(90deg,#4fc3f7,#b388ff,#ff8ab4);border-radius:4px}
#umbral{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6;left:30%}
#contador{font-size:13px;color:var(--dim);white-space:nowrap}
#ajustes{position:fixed;left:0;right:0;bottom:0;max-height:54vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));z-index:3;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ajustes h2{font-size:17px;font-weight:600}
#ajustes h3{font-size:13px;font-weight:600;color:var(--dim);margin:16px 0 6px}
.cab{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--panel);padding:4px 0 8px;z-index:1}
.ctrl{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px}
.ctrl label{font-size:14px}
.ctrl output{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.ctrl input{grid-column:1/-1;width:100%;height:36px;accent-color:#9fe8ff}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;min-height:38px;padding:0;border-radius:50%;border:2px solid var(--line);position:relative;overflow:hidden}
.sw[aria-checked=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--line)}
.sw.auto{background:conic-gradient(#ff8ab4,#ffd36b,#8dffb0,#7fd8ff,#b388ff,#ff8ab4)}
.sw input{position:absolute;inset:-10px;width:60px;height:60px;opacity:0;cursor:pointer}
.sw.libre{background:conic-gradient(#fff,#888,#222,#fff)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
#jsonAjustes{width:100%;margin-top:10px;font:12px/1.4 ui-monospace,monospace;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px}
#inicio{position:fixed;inset:0;display:grid;place-content:center;gap:16px;text-align:center;padding:24px;background:rgba(5,11,24,.9);z-index:5}
#inicio h1{font-weight:300;font-size:clamp(30px,8vw,44px);line-height:1.05;color:#e8f1ff}
#inicio p{color:#8fa3c4;max-width:34ch;margin:0 auto}
.exp{display:grid;gap:4px;text-align:left;width:min(340px,86vw);padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,#123052,#1d1640);border:1px solid #ffffff2a;color:#e8f1ff;min-height:72px}
.exp b{font-size:17px;font-weight:600}.exp span{font-size:13px;color:#a9bad6}
.exp[disabled]{opacity:.45}
#aviso{color:#ffb4c8;font-size:14px;max-width:36ch;margin:0 auto}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="estado">Calibrando el silencio…</div>
  <div class="fila">
    <div class="medidor"><div id="nivel"></div><div id="umbral"></div></div>
    <span id="contador">0 burbujas</span>
  </div>
  <div class="fila botones">
    <button id="bMenu">Menú</button>
    <button id="recal">Recalibrar</button>
    <button id="bAjustes">Ajustes</button>
  </div>
</div>

<div id="ajustes" hidden>
  <div class="cab"><h2>Ajustes · Burbuja</h2><button id="cerrar">Cerrar</button></div>
  <h3>Color de la burbuja</h3><div class="sws" id="swBurbuja"></div>
  <h3>Color de fondo</h3><div class="sws" id="swFondo"></div>
  <h3>Material</h3><div id="grpMaterial"></div>
  <h3>Respiración</h3><div id="grpResp"></div>
  <h3>Crecimiento</h3><div id="grpCrec"></div>
  <h3>Aspecto</h3><div id="grpAsp"></div>
  <h3>Explosión</h3><div id="grpExp"></div>
  <div class="acciones">
    <button id="copiar">Copiar ajustes</button>
    <button id="reset">Restablecer</button>
  </div>
  <textarea id="jsonAjustes" readonly hidden aria-label="Ajustes en texto"></textarea>
</div>

<div id="inicio">
  <h1>Experiencias de aliento</h1>
  <p>Elige una experiencia. Sopla por el tubo y mira cómo responde.</p>
  <button class="exp" id="expBurbuja"><b>Burbuja</b><span>Crece mientras exhalas y estalla al terminar.</span></button>
  <button class="exp" disabled><b>Próximamente</b><span>La diseñaremos juntos cuando la burbuja esté cerrada.</span></button>
  <p id="aviso" hidden></p>
</div>

<script>
{
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
const resize = () => {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
};
addEventListener('resize', resize); resize();

/* ---------- Ajustes (se guardan en el móvil) ---------- */
const DEF = { sens: 5, espera: 0.3, crecimiento: 140, tamMax: 0.42, solidez: 0, grosor: 1, brillo: 1, temblor: 1, gotas: 70, velGotas: 1, renacer: 0.7, color: null, fondo: '#050b18' };
let A = { ...DEF };
try { Object.assign(A, JSON.parse(localStorage.getItem('burbujaAjustes') || '{}')); } catch (e) {}
const guardar = () => { try { localStorage.setItem('burbujaAjustes', JSON.stringify(A)); } catch (e) {} };

const CONTROLES = {
  grpMaterial: [['solidez', 'Solidez (pompa → chicle)', 0, 1, 0.05, v => Math.round(v * 100) + '%'], ['grosor', 'Grosor del borde', 0.3, 3, 0.1, v => v.toFixed(1) + '×']],
  grpResp: [['sens', 'Sensibilidad del micro', 1, 10, 0.5, v => v.toFixed(1)], ['espera', 'Pausa antes de explotar', 0.1, 1.5, 0.05, v => v.toFixed(2) + ' s']],
  grpCrec: [['crecimiento', 'Velocidad de inflado', 40, 400, 10, v => Math.round(v)], ['tamMax', 'Tamaño máximo', 0.2, 0.48, 0.01, v => Math.round(v * 100) + '%']],
  grpAsp: [['brillo', 'Brillo y halo al soplar', 0, 2, 0.05, v => v.toFixed(2) + '×'], ['temblor', 'Temblor del borde', 0, 3, 0.1, v => v.toFixed(1) + '×']],
  grpExp: [['gotas', 'Cantidad de fragmentos', 10, 200, 5, v => Math.round(v)], ['velGotas', 'Fuerza de la explosión', 0.3, 2.5, 0.05, v => v.toFixed(2) + '×'], ['renacer', 'Tiempo hasta la nueva', 0.2, 3, 0.1, v => v.toFixed(1) + ' s']]
};
function pintarControles() {
  for (const [grp, lista] of Object.entries(CONTROLES)) {
    $(grp).innerHTML = lista.map(([k, l, mn, mx, st]) =>
      `<div class="ctrl"><label for="r_${k}">${l}</label><output id="o_${k}"></output><input id="r_${k}" type="range" min="${mn}" max="${mx}" step="${st}" value="${A[k]}"></div>`).join('');
    for (const [k, , , , , fmt] of lista) {
      const r = $('r_' + k), o = $('o_' + k);
      o.textContent = fmt(A[k]);
      r.addEventListener('input', () => { A[k] = +r.value; o.textContent = fmt(A[k]); guardar(); });
    }
  }
}

/* colores */
const hexAHue = hex => {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (!d) return 200;
  const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
};
const hexARgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const COL_B = [['Automático', null], ['Azul', 205], ['Turquesa', 172], ['Verde', 135], ['Oro', 45], ['Coral', 12], ['Chicle', 330], ['Violeta', 270]];
const COL_F = [['Noche', '#050b18'], ['Negro', '#000000'], ['Ciruela', '#1a0f1f'], ['Bosque', '#071a14'], ['Arena', '#efe6d8'], ['Blanco', '#f6f7fb'], ['Rosa', '#ffd9e6'], ['Cielo', '#cfe8ff']];
let fondoRGB = hexARgb(A.fondo), fondoClaro = false;
function aplicarFondo() {
  fondoRGB = hexARgb(A.fondo);
  const [r, g, b] = fondoRGB;
  fondoClaro = (0.299 * r + 0.587 * g + 0.114 * b) > 150;
  document.documentElement.classList.toggle('claro', fondoClaro);
  document.documentElement.style.setProperty('--panel', `rgba(${r},${g},${b},.93)`);
  document.body.style.background = A.fondo;
}
function pintarColores() {
  const marca = (cont, el) => { for (const b of cont.querySelectorAll('.sw')) b.setAttribute('aria-checked', b === el); };
  const sb = $('swBurbuja');
  sb.innerHTML = COL_B.map(([n, h]) => `<button class="sw${h === null ? ' auto' : ''}" role="radio" aria-label="${n}" data-h="${h ?? ''}" aria-checked="${A.color === h}" style="${h === null ? '' : `background:hsl(${h},80%,62%)`}"></button>`).join('')
    + `<span class="sw libre" role="radio" aria-label="Otro color" aria-checked="${A.color !== null && !COL_B.some(c => c[1] === A.color)}"><input type="color" value="#7fd8ff" aria-label="Otro color de burbuja"></span>`;
  for (const b of sb.querySelectorAll('button.sw')) b.onclick = () => { A.color = b.dataset.h === '' ? null : +b.dataset.h; marca(sb, b); if (A.color !== null) burbuja.hue = A.color; guardar(); };
  sb.querySelector('input').oninput = e => { const s = e.target.parentElement; s.style.background = e.target.value; A.color = hexAHue(e.target.value); burbuja.hue = A.color; marca(sb, s); guardar(); };
  const sf = $('swFondo');
  sf.innerHTML = COL_F.map(([n, c]) => `<button class="sw" role="radio" aria-label="${n}" data-c="${c}" aria-checked="${A.fondo === c}" style="background:${c}"></button>`).join('')
    + `<span class="sw libre" role="radio" aria-label="Otro fondo" aria-checked="${!COL_F.some(c => c[1] === A.fondo)}"><input type="color" value="${A.fondo}" aria-label="Otro color de fondo"></span>`;
  for (const b of sf.querySelectorAll('button.sw')) b.onclick = () => { A.fondo = b.dataset.c; marca(sf, b); aplicarFondo(); guardar(); };
  sf.querySelector('input').oninput = e => { const s = e.target.parentElement; s.style.background = e.target.value; A.fondo = e.target.value; marca(sf, s); aplicarFondo(); guardar(); };
}

/* ---------- Audio ---------- */
let analyser = null, buf = null, ruido = 0.01, calibrando = 0, sumaCal = 0, nCal = 0, nivel = 0, tocando = false;
async function iniciarMicro() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
  const ac = new (window.AudioContext || window.webkitAudioContext)();
  await ac.resume();
  analyser = ac.createAnalyser(); analyser.fftSize = 1024;
  ac.createMediaStreamSource(stream).connect(analyser);
  buf = new Float32Array(analyser.fftSize);
  recalibrar();
}
const recalibrar = () => { calibrando = 1.5; sumaCal = 0; nCal = 0; };
const pct = v => Math.min(100, Math.max(0, (Math.log10(v + 1e-5) + 3) / 2.6 * 100));
function leerNivel(dt) {
  let rms = 0;
  if (analyser) {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i];
    rms = Math.sqrt(s / buf.length);
    if (calibrando > 0) { calibrando -= dt; sumaCal += rms; nCal++; if (calibrando <= 0) ruido = Math.max(sumaCal / nCal, 0.002); }
  }
  const umbral = ruido * (1.6 + (10 - A.sens) * 0.9) + 0.004;
  const fuerza = tocando ? 0.8 : Math.max(0, (rms - umbral) / (umbral * 4));
  nivel += (fuerza - nivel) * Math.min(1, dt * 12);
  $('nivel').style.width = (tocando ? 70 : pct(rms)) + '%';
  $('umbral').style.left = pct(umbral) + '%';
}

/* ---------- Burbuja ---------- */
const burbuja = { r: 0, obj: 14, viva: true, soplando: false, silencio: 0, nace: 0, hue: 200 };
let parts = [], ondas = [], espera = 0, cuenta = 0, t = 0, cyF = 0.44, panelAbierto = false;
const motas = Array.from({ length: 50 }, () => ({ x: Math.random(), y: Math.random(), v: 0.004 + Math.random() * 0.01, s: 0.5 + Math.random() * 1.5 }));
const nueva = () => Object.assign(burbuja, { r: 0, obj: 14, viva: true, soplando: false, silencio: 0, nace: 0, hue: A.color ?? Math.random() * 360 });
const centro = () => [W / 2, H * cyF + Math.sin(t * 0.8) * 6];
const maxR = () => Math.min(W, panelAbierto ? H * 0.5 : H) * A.tamMax;

function explotar() {
  const [cx, cy] = centro(), r = burbuja.r, s = A.solidez;
  for (let i = 0; i < A.gotas; i++) {
    const chicle = Math.random() < s, a = Math.random() * Math.PI * 2;
    const sp = (chicle ? 0.55 : 1) * A.velGotas * (60 + Math.random() * 260 * (0.4 + r / 200));
    parts.push({ x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, vida: 1, chicle,
      h: (burbuja.hue + (A.color === null && !chicle ? i * 9 : (i % 7) * 4)) % 360,
      s: chicle ? (3 + Math.random() * 9) * (0.5 + r / 150) : 1 + Math.random() * 2.5, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8 });
  }
  if (s < 0.9) ondas.push({ r, vida: 1 - s });
  burbuja.viva = false; espera = A.renacer;
  cuenta++; $('contador').textContent = cuenta + (cuenta === 1 ? ' burbuja' : ' burbujas');
}

function actualizar(dt) {
  leerNivel(dt);
  cyF += ((panelAbierto ? 0.27 : 0.44) - cyF) * Math.min(1, dt * 5);
  const f = nivel, m = maxR();
  if (burbuja.viva) {
    burbuja.nace = Math.min(1, burbuja.nace + dt * 1.5);
    if (f > 0.05) {
      burbuja.soplando = true; burbuja.silencio = 0;
      burbuja.obj += f * dt * A.crecimiento * (1 - burbuja.obj / (m * 1.15));
      burbuja.hue = A.color === null ? (burbuja.hue + dt * 40 * f) % 360 : A.color + Math.sin(t * 1.5) * 8;
    } else if (burbuja.soplando) {
      burbuja.silencio += dt;
      if (burbuja.silencio > A.espera) explotar();
    }
    if (burbuja.viva && burbuja.obj >= m) explotar();
    burbuja.r += (burbuja.obj - burbuja.r) * Math.min(1, dt * 6);
    $('estado').textContent = calibrando > 0 ? 'Calibrando el silencio… no soples' : burbuja.soplando ? 'Exhala despacio…' : 'Sopla para inflar la burbuja';
  } else if ((espera -= dt) <= 0) nueva();
  parts = parts.filter(p => (p.vida -= dt * (p.chicle ? 0.7 : 1.1)) > 0);
  for (const p of parts) {
    p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    const roce = p.chicle ? 0.93 : 0.96; p.vx *= roce; p.vy = p.vy * roce + (p.chicle ? 420 : 40) * dt;
  }
  ondas = ondas.filter(o => (o.vida -= dt * 2) > 0);
  for (const o of ondas) o.r += dt * 260;
}

/* ---------- Dibujo ---------- */
function fondo() {
  const [r, g, b] = fondoRGB, [cx, cy] = centro();
  ctx.fillStyle = A.fondo; ctx.fillRect(0, 0, W, H);
  const lz = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
  lz.addColorStop(0, `hsla(${burbuja.hue},70%,${fondoClaro ? 70 : 55}%,${0.1 + Math.min(1, nivel) * 0.25 * A.brillo})`);
  lz.addColorStop(1, 'hsla(0,0%,0%,0)');
  ctx.fillStyle = lz; ctx.fillRect(0, 0, W, H);
  const vi = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.8);
  vi.addColorStop(0, 'rgba(0,0,0,0)'); vi.addColorStop(1, `rgba(0,0,0,${fondoClaro ? 0.1 : 0.4})`);
  ctx.fillStyle = vi; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = fondoClaro ? `rgb(${r * 0.6},${g * 0.6},${b * 0.6})` : '#bfe6ff';
  for (const mo of motas) {
    mo.y -= mo.v * 0.016; if (mo.y < 0) { mo.y = 1; mo.x = Math.random(); }
    ctx.globalAlpha = 0.12 + 0.12 * Math.sin(t + mo.x * 9);
    ctx.beginPath(); ctx.arc(mo.x * W, mo.y * H, mo.s, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function forma(cx, cy, r) {
  ctx.beginPath();
  const amp = (0.012 + nivel * 0.025) * A.temblor;
  for (let i = 0; i <= 64; i++) {
    const a = i / 64 * Math.PI * 2, k = 1 + amp * Math.sin(3 * a + t * 2.1) + amp * 0.6 * Math.sin(5 * a - t * 1.3);
    i ? ctx.lineTo(cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k) : ctx.moveTo(cx + Math.cos(a) * r * k, cy + Math.sin(a) * r * k);
  }
  ctx.closePath();
}

function dibujarBurbuja() {
  if (!burbuja.viva) return;
  const [cx, cy] = centro(), r = Math.max(2, burbuja.r * (0.3 + 0.7 * burbuja.nace)), h = burbuja.hue;
  const s = A.solidez, B = A.brillo, f = Math.min(1, nivel);
  // halo
  const halo = ctx.createRadialGradient(cx, cy, r * 0.8, cx, cy, r * (1.6 + f));
  halo.addColorStop(0, `hsla(${h},90%,70%,${(0.12 + f * 0.35) * B * (1 - s * 0.6)})`);
  halo.addColorStop(1, 'hsla(0,0%,0%,0)');
  ctx.fillStyle = halo; ctx.fillRect(0, 0, W, H);
  // pompa de jabón (transparente)
  if (s < 1) {
    ctx.globalAlpha = 1 - s;
    forma(cx, cy, r);
    const c = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
    c.addColorStop(0, 'hsla(0,0%,100%,0.02)'); c.addColorStop(0.75, `hsla(${h + 40},80%,70%,0.06)`); c.addColorStop(1, `hsla(${h + 120},90%,75%,0.22)`);
    ctx.fillStyle = c; ctx.fill();
    ctx.lineWidth = Math.max(1.5, r * 0.045 * A.grosor);
    if (ctx.createConicGradient) {
      const g = ctx.createConicGradient(t * 0.6, cx, cy), paso = A.color === null ? 60 : 10, tr = [0, 1, 2, 3, 2, 1, 0];
      for (let i = 0; i <= 6; i++) g.addColorStop(i / 6, `hsla(${(h + tr[i] * paso) % 360},95%,${68 + tr[i] * 4}%,${Math.min(1, (0.45 + f * 0.4) * B)})`);
      ctx.strokeStyle = g;
    } else ctx.strokeStyle = `hsla(${h},90%,75%,0.6)`;
    ctx.shadowColor = `hsl(${h},100%,70%)`; ctx.shadowBlur = (10 + f * 30) * B;
    ctx.stroke(); ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
  // globo de chicle (opaco, se aclara al estirarse)
  if (s > 0) {
    const estira = Math.min(1, burbuja.r / maxR());
    ctx.globalAlpha = s * (1 - 0.2 * estira);
    forma(cx, cy, r);
    const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.4, r * 0.05, cx, cy, r * 1.05);
    g.addColorStop(0, `hsl(${h},80%,${84 + estira * 6}%)`);
    g.addColorStop(0.55, `hsl(${h},70%,${62 + estira * 10}%)`);
    g.addColorStop(1, `hsl(${h},60%,${40 + estira * 10}%)`);
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = Math.max(1, r * 0.02 * A.grosor); ctx.strokeStyle = `hsla(${h},55%,32%,0.5)`; ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // reflejos: nítido en la pompa, suave y ancho en el chicle
  ctx.save(); ctx.translate(cx - r * 0.38, cy - r * 0.42); ctx.rotate(-0.6);
  const rr = r * (0.28 + s * 0.08), br = ctx.createRadialGradient(0, 0, 0, 0, 0, rr);
  br.addColorStop(0, `rgba(255,255,255,${0.85 - s * 0.35})`); br.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = br; ctx.scale(1, 0.55); ctx.beginPath(); ctx.arc(0, 0, rr, 0, 7); ctx.fill();
  ctx.restore();
  ctx.fillStyle = `rgba(255,255,255,${0.35 * (1 - s * 0.5)})`;
  ctx.beginPath(); ctx.arc(cx + r * 0.45, cy + r * 0.5, r * 0.05, 0, 7); ctx.fill();
}

function dibujarExplosion() {
  const [cx, cy] = centro();
  for (const o of ondas) {
    ctx.strokeStyle = fondoClaro ? `rgba(40,60,90,${o.vida * 0.4})` : `rgba(220,240,255,${o.vida * 0.5})`;
    ctx.lineWidth = 2 * o.vida; ctx.beginPath(); ctx.arc(cx, cy, o.r, 0, 7); ctx.stroke();
  }
  for (const p of parts) {
    if (p.chicle) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.globalAlpha = Math.min(1, p.vida * 1.5);
      ctx.fillStyle = `hsl(${p.h},70%,62%)`; ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(-p.s * 0.3, -p.s * 0.15, p.s * 0.3, p.s * 0.15, 0, 0, 7); ctx.fill();
      ctx.restore(); ctx.globalAlpha = 1;
    } else {
      ctx.fillStyle = `hsla(${p.h},95%,${fondoClaro ? 55 : 80}%,${p.vida})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.s * p.vida, 0, 7); ctx.fill();
    }
  }
}

let ultimo = performance.now();
function bucle(ahora) {
  const dt = Math.min(0.05, (ahora - ultimo) / 1000); ultimo = ahora; t += dt;
  actualizar(dt); fondo(); dibujarBurbuja(); dibujarExplosion();
  requestAnimationFrame(bucle);
}

/* ---------- Interfaz ---------- */
let microListo = false;
$('expBurbuja').addEventListener('click', async () => {
  const av = $('aviso');
  if (!microListo) {
    av.hidden = false; av.textContent = 'Pidiendo el micrófono…';
    try {
      if (!window.isSecureContext || !navigator.mediaDevices) throw { name: 'página no segura: hay que abrirla desde https' };
      await Promise.race([iniciarMicro(), new Promise((_, no) => setTimeout(() => no({ name: 'el navegador no responde' }), 6000))]);
      microListo = true; av.hidden = true;
    } catch (e) {
      av.textContent = 'No se pudo usar el micrófono (' + (e.name || 'error') + '). Vuelve a tocar Burbuja para seguir sin micro: mantén el dedo pulsado sobre la pantalla para inflar.';
      microListo = true; return;
    }
  }
  $('inicio').hidden = true; $('hud').hidden = false; nueva();
});
$('bMenu').onclick = () => { $('inicio').hidden = false; $('hud').hidden = true; $('ajustes').hidden = true; panelAbierto = false; };
$('recal').onclick = recalibrar;
$('bAjustes').onclick = () => { $('ajustes').hidden = false; $('hud').hidden = true; panelAbierto = true; };
$('cerrar').onclick = () => { $('ajustes').hidden = true; $('hud').hidden = false; panelAbierto = false; };
$('copiar').onclick = async () => {
  const txt = JSON.stringify(A), ta = $('jsonAjustes');
  ta.value = txt; ta.hidden = false;
  try { await navigator.clipboard.writeText(txt); $('copiar').textContent = 'Copiado ✓'; }
  catch (e) { ta.select(); $('copiar').textContent = 'Copia el texto de abajo'; }
  setTimeout(() => $('copiar').textContent = 'Copiar ajustes', 2500);
};
$('reset').onclick = () => { A = { ...DEF }; guardar(); aplicarFondo(); pintarControles(); pintarColores(); };
cv.addEventListener('pointerdown', () => tocando = true);
addEventListener('pointerup', () => tocando = false);
addEventListener('pointercancel', () => tocando = false);

aplicarFondo(); pintarControles(); pintarColores(); nueva();
requestAnimationFrame(bucle);
}
