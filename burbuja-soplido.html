<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Air Fede</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sacramento&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: calma, contemplativa
   IDEA: un objeto que vive del aliento
   PICTURE: el objeto a pantalla completa
   COLOUR and TYPE: fondo elegible, color elegible; sans ligera
   LAYOUT: lienzo completo; HUD mínimo; panel de ajustes abajo */
:root{--ink:#e8f1ff;--dim:#8fa3c4;--panel:rgba(5,11,24,.93);--line:#ffffff24;--chip:#ffffff14}
:root.claro{--ink:#14203a;--dim:#55637c;--line:#0000001f;--chip:#0000000d}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;background:#050b18;color:var(--ink);font:15px/1.4 Raleway,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:var(--ink);background:var(--chip);border:1px solid var(--line);border-radius:22px;min-height:44px;padding:0 16px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid #9fe8ff;outline-offset:2px}
#hud{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));display:grid;gap:10px}
#estado{font-size:14px;color:var(--dim);text-align:center;min-height:20px}
.fila{display:flex;align-items:center;gap:10px}
.fila.botones{justify-content:space-between}
.medidor{flex:1;height:8px;border-radius:4px;background:var(--chip);position:relative}
#nivel{height:100%;width:0;background:linear-gradient(90deg,#4fc3f7,#b388ff,#ff8ab4);border-radius:4px}
#umbral{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6;left:30%}
#contador{font-size:13px;color:var(--dim);white-space:nowrap}
#ajustes{position:fixed;left:0;right:0;bottom:0;max-height:54vh;overflow-y:auto;background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 18px calc(18px + env(safe-area-inset-bottom));z-index:3;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#ajustes h2{font-size:17px;font-weight:600}
#ajustes h3{font-size:13px;font-weight:600;color:var(--dim);margin:16px 0 6px}
.cab{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-14px;background:var(--panel);padding:4px 0 8px;z-index:1}
.ctrl{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:10px}
.ctrl label{font-size:14px}
.ctrl output{font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.ctrl input{grid-column:1/-1;width:100%;height:36px;accent-color:#9fe8ff}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;min-height:38px;padding:0;border-radius:50%;border:2px solid var(--line);position:relative;overflow:hidden}
.sw[aria-checked=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--line)}
.sw.auto{background:conic-gradient(#ff8ab4,#ffd36b,#8dffb0,#7fd8ff,#b388ff,#ff8ab4)}
.sw input{position:absolute;inset:-10px;width:60px;height:60px;opacity:0;cursor:pointer}
.sw.libre{background:conic-gradient(#fff,#888,#222,#fff)}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
#jsonAjustes{width:100%;margin-top:10px;font:12px/1.4 ui-monospace,monospace;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;min-height:90px}
/* Portada */
:root{--f-tit:Sacramento,cursive;--w-tit:400;--t-tit:none;--ls-tit:0em;--f-txt:Raleway,system-ui,sans-serif}
#inicio{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:1fr auto auto;gap:20px;padding:calc(28px + env(safe-area-inset-top)) 22px calc(22px + env(safe-area-inset-bottom));background:radial-gradient(120% 70% at 50% 30%,#0d2233 0%,#050b18 60%,#03060e 100%);font-family:var(--f-txt);overflow-y:auto}
.portada{display:grid;align-content:center;justify-items:center;gap:6px;text-align:center}
#inicio h1{font-family:var(--f-tit);font-weight:var(--w-tit);text-transform:var(--t-tit);letter-spacing:var(--ls-tit);font-size:clamp(60px,18vw,88px);line-height:1;color:#f4feff;text-shadow:0 0 6px #ffffffaa,0 0 22px #7ff0e6aa,0 0 48px #9fb8ff55;margin-right:calc(-1 * var(--ls-tit))}
.lema{text-wrap:balance;font-size:15px;font-weight:300;color:#9fb3cf;max-width:28ch;line-height:1.5}
.lista{display:grid;gap:10px;width:min(420px,100%);justify-self:center}
.lista h2{font-size:12px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:#6f85a6;padding-left:4px}
.exp{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;text-align:left;width:100%;min-height:76px;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#ffffff10,#ffffff05);border:1px solid #bff6f02e;color:#effcff;font-family:var(--f-txt)}
.exp:active{transform:scale(.98)}
.exp .ico svg{width:44px;height:44px;display:block}
.exp .txt{display:grid;gap:2px}
.exp b{font-size:17px;font-weight:500}.exp .txt span{font-size:13px;font-weight:300;color:#9fb3cf;line-height:1.35}
.exp .flecha{font-size:26px;color:#7ff0e6;line-height:1}
.pie{text-align:center;font-size:12px;font-weight:300;color:#5f7493}
#aviso{color:#ffb4c8;font-size:14px;line-height:1.45;padding:0 4px}
#logo{width:100%;max-width:420px;aspect-ratio:760/470;height:auto;justify-self:center;mix-blend-mode:lighten;-webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 88%,transparent),linear-gradient(transparent,#000 4%,#000 92%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 6%,#000 88%,transparent),linear-gradient(transparent,#000 4%,#000 92%,transparent);mask-composite:intersect;}
@keyframes latir{50%{filter:brightness(1.2)}}
@media (prefers-reduced-motion:reduce){#logo{animation:none}}

/* ---------- Estética Air Fede: cristal oscuro y líneas de luz ---------- */
:root{--acento:#7ff0e6;--linea:rgba(191,246,240,.26);--cristal:rgba(6,14,28,.62);--brilloTxt:0 0 10px rgba(127,240,230,.45)}
:root.claro{--acento:#0d7f88;--linea:rgba(20,32,58,.18);--cristal:rgba(255,255,255,.55);--brilloTxt:none}
button svg,.redondo svg,.flecha svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px rgba(127,240,230,.55))}
:root.claro button svg{filter:none}
.pil{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px 0 14px;border-radius:24px;background:var(--cristal);border:1px solid var(--linea);color:var(--ink);font:500 14px Raleway,system-ui,sans-serif;letter-spacing:.02em;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 0 18px rgba(127,240,230,.06);transition:box-shadow .2s,border-color .2s}
.pil:active{border-color:var(--acento);box-shadow:0 0 16px rgba(127,240,230,.35)}
#hud{gap:12px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
#estado{font:400 14px Raleway,system-ui,sans-serif;letter-spacing:.02em;color:var(--dim)}
.medidor{height:3px;border-radius:2px;background:var(--linea)}
#nivel{border-radius:2px;background:linear-gradient(90deg,#bdfcf4,#6ff0e0 40%,#7f8cff 75%,#b68cff);box-shadow:0 0 10px rgba(127,240,230,.7)}
#umbral{width:1.5px;top:-6px;bottom:-6px;background:var(--ink);opacity:.45;border-radius:1px}
#contador{font:400 13px Raleway,system-ui,sans-serif;color:var(--dim)}
#ajustes{background:var(--cristal);-webkit-backdrop-filter:blur(16px) saturate(1.2);backdrop-filter:blur(16px) saturate(1.2);border:0;border-radius:26px 26px 0 0;box-shadow:0 -1px 0 var(--linea),0 -18px 40px rgba(0,0,0,.35);padding-top:8px;font-family:Raleway,system-ui,sans-serif}
#ajustes::before{content:"";position:sticky;display:block;top:-8px;height:1px;margin:0 -18px;background:linear-gradient(90deg,transparent,rgba(127,240,230,.55),rgba(182,140,255,.45),transparent)}
.asa{width:38px;height:4px;border-radius:2px;background:var(--linea);margin:6px auto 2px}
.cab{background:transparent;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);top:-8px;padding:6px 0 10px;align-items:flex-end}
#ajustes h2{font:400 46px/1 Sacramento,cursive;color:var(--ink);text-shadow:var(--brilloTxt);margin-bottom:-2px}
.sub{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding-left:3px}
.redondo{width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--cristal);border:1px solid var(--linea);color:var(--ink)}
#ajustes h3{font:500 11.5px Raleway,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--acento);opacity:.85;margin:22px 0 8px}
.ctrl{margin-top:4px}.ctrl label{font-size:14.5px;font-weight:500}
.ctrl output{font-size:13px;color:var(--acento)}
.ctrl input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:34px}
.ctrl input[type=range]::-webkit-slider-runnable-track{height:2px;border-radius:1px;background:linear-gradient(90deg,#6ff0e0,#7f8cff 60%,#b68cff);box-shadow:0 0 8px rgba(127,240,230,.45)}
.ctrl input[type=range]::-moz-range-track{height:2px;border-radius:1px;background:linear-gradient(90deg,#6ff0e0,#7f8cff 60%,#b68cff)}
.ctrl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-9px;border-radius:50%;background:#f2feff;border:0;box-shadow:0 0 0 4px rgba(127,240,230,.18),0 0 14px rgba(127,240,230,.8)}
.ctrl input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#f2feff;border:0;box-shadow:0 0 0 4px rgba(127,240,230,.18),0 0 14px rgba(127,240,230,.8)}
:root.claro .ctrl input[type=range]::-webkit-slider-thumb{background:#14203a;box-shadow:0 0 0 4px rgba(20,32,58,.12)}
.sws{gap:10px}
.sw{width:34px;height:34px;min-height:34px;border:1px solid var(--linea)}
.sw[aria-checked=true]{border-color:transparent;box-shadow:0 0 0 2px var(--bgsw,#050b18),0 0 0 3.5px var(--acento),0 0 14px rgba(127,240,230,.6)}
.acciones button{background:var(--cristal);border:1px solid var(--linea);border-radius:24px;font:500 14px Raleway,system-ui,sans-serif}
#jsonAjustes{background:var(--cristal);border-color:var(--linea)}
.exp{border-color:rgba(191,246,240,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 0 24px rgba(127,240,230,.06)}
.exp:active{border-color:#7ff0e6;box-shadow:0 0 18px rgba(127,240,230,.3)}
.exp .ico svg{filter:drop-shadow(0 0 4px rgba(127,240,230,.7))}
.flecha{color:#7ff0e6;display:grid}

/* ---------- Sistema tipográfico y de espacios ----------
   Escala: 12 · 14 · 16 · 20 (Raleway) · display Sacramento 48 / 84
   Espacios: 4 · 8 · 12 · 16 · 24 · 32 */
html{-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility;font-kerning:normal;font-feature-settings:"kern","liga"}
body,button,input,textarea{font-family:Raleway,system-ui,sans-serif;letter-spacing:.005em}
/* Portada */
#inicio{gap:0;padding:calc(24px + env(safe-area-inset-top)) 24px calc(20px + env(safe-area-inset-bottom))}
.portada{gap:0}
#inicio h1{font:400 clamp(68px,20vw,92px)/.95 Sacramento,cursive;letter-spacing:0;margin:4px 0 0}
.lema{font:400 16px/1.5 Raleway,system-ui,sans-serif;letter-spacing:.01em;color:#a3b6d2;max-width:26ch;margin-top:12px}
.lista{gap:0;margin-top:32px}
.lista .exp + .exp{margin-top:10px}
.lista h2{font:600 12px/1 Raleway,system-ui,sans-serif;letter-spacing:.08em;color:#7d93b3;padding:0 4px;margin-bottom:12px}
.exp{min-height:80px;padding:16px 16px 16px 14px;gap:14px;border-radius:20px}
.exp b{font:600 16px/1.2 Raleway,system-ui,sans-serif;letter-spacing:.01em}
.exp .txt{gap:4px}
.exp .txt span{font:400 14px/1.4 Raleway,system-ui,sans-serif;color:#a3b6d2;text-wrap:pretty}
.pie{font:400 12px/1.4 Raleway,system-ui,sans-serif;letter-spacing:.01em;color:#6a7f9e;margin-top:16px}
#aviso{font-size:14px;line-height:1.45;margin-top:12px}
/* Barra de la burbuja */
#hud{gap:0;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
#estado{font:400 14px/1.4 Raleway,system-ui,sans-serif;letter-spacing:.01em;min-height:20px;margin-bottom:12px}
#hud .fila:not(.botones){gap:12px;margin-bottom:16px}
#contador{font:500 12px/1 Raleway,system-ui,sans-serif;letter-spacing:.02em;font-variant-numeric:tabular-nums;min-width:74px;text-align:right}
.fila.botones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pil{justify-content:center;gap:6px;min-height:48px;padding:0 10px;font:500 14px/1 Raleway,system-ui,sans-serif;letter-spacing:.01em}
.pil svg{width:18px;height:18px;flex:none}
/* Panel de ajustes */
#ajustes{padding:4px 20px calc(24px + env(safe-area-inset-bottom))}
.asa{margin:8px auto 0}
.cab{display:flex;justify-content:space-between;align-items:center;padding:12px 0 16px;margin-bottom:4px;border-bottom:1px solid var(--linea)}
.tit{display:grid;gap:2px}
#ajustes h2{font:400 48px/1 Sacramento,cursive;letter-spacing:0;margin:0;padding-top:4px}
.sub{font:500 14px/1.2 Raleway,system-ui,sans-serif;letter-spacing:.01em;text-transform:none;color:var(--dim);padding-left:2px}
#ajustes h3{font:600 12px/1 Raleway,system-ui,sans-serif;letter-spacing:.08em;margin:28px 0 12px}
.ctrl{row-gap:0;margin-top:0}
.ctrl + .ctrl{margin-top:12px}
.ctrl label{font:500 15px/1.3 Raleway,system-ui,sans-serif;letter-spacing:.005em}
.ctrl output{font:500 13px/1.3 Raleway,system-ui,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.ctrl input[type=range]{height:32px;margin-top:2px}
.sws{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;max-width:360px}
.sw{width:100%;height:auto;aspect-ratio:1;min-height:0;max-width:36px}
.acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:32px}
.acciones button{min-height:48px;font:500 14px/1 Raleway,system-ui,sans-serif}
#jsonAjustes{margin-top:12px}

/* Raleway: cifras de altura uniforme; título del panel en la misma letra que el resto */
html{font-variant-numeric:lining-nums}
body,button,input,textarea,output{font-variant-numeric:lining-nums tabular-nums}
#ajustes h2{font:600 22px/1.2 Raleway,system-ui,sans-serif;letter-spacing:.01em;text-shadow:none;padding-top:0}
.tit{gap:4px}
.sub{font:500 14px/1.3 Raleway,system-ui,sans-serif}
.cab{padding:16px 0}

/* Trazo del aliento en la portada: detrás del contenido */
#trazo{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.portada,.lista,.pie,#aviso{position:relative;z-index:1}

/* Diente de león */
#cd{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;z-index:1}
#hudD{position:fixed;left:0;right:0;bottom:0;z-index:2;display:grid;gap:14px;padding:28px 16px calc(16px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(5,11,24,.85) 30%)}
#dPista{font:400 14px/1.4 Raleway,system-ui,sans-serif;letter-spacing:.01em;color:#8fa3c4;text-align:center}
.dSws{display:flex;justify-content:center;gap:12px}
.dSws .sw{width:34px;height:34px;max-width:none;aspect-ratio:auto}
.fila.botones.dos{grid-template-columns:repeat(2,minmax(0,1fr))}
</style>
</head>
<body>
<canvas id="c"></canvas>

<canvas id="cd" hidden aria-label="Diente de león de luz que suelta semillas al soplar"></canvas>
<div id="hudD" hidden>
  <p id="dPista">Sopla o mantén el dedo pulsado</p>
  <div class="dSws" id="dSws" role="radiogroup" aria-label="Color del diente de león"></div>
  <div class="fila botones dos">
    <button id="dMenu" class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v8.5h11V10"/></svg><span>Inicio</span></button>
    <button id="dRecal" class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5v3.5h-3.5"/></svg><span>Recalibrar</span></button>
  </div>
</div>
<div id="hud" hidden>
  <div id="estado">Calibrando el silencio…</div>
  <div class="fila">
    <div class="medidor"><div id="nivel"></div><div id="umbral"></div></div>
    <span id="contador">0 burbujas</span>
  </div>
  <div class="fila botones">
    <button id="bMenu" class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v8.5h11V10"/></svg><span>Inicio</span></button>
    <button id="recal" class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4.5v3.5h-3.5"/></svg><span>Recalibrar</span></button>
    <button id="bAjustes" class="pil"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h9M18 7h1M5 12h3M12 12h7M5 17h9M18 17h1M16 5v4M10 10v4M16 15v4"/></svg><span>Ajustes</span></button>
  </div>
</div>

<div id="ajustes" hidden>
  <div class="asa" aria-hidden="true"></div><div class="cab"><div class="tit"><h2>Ajustes</h2><p class="sub">Burbuja</p></div><button id="cerrar" class="redondo" aria-label="Cerrar ajustes"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
  <h3>Color de la burbuja</h3><div class="sws" id="swBurbuja"></div>
  <h3>Color de fondo</h3><div class="sws" id="swFondo"></div>
  <h3>Material</h3><div id="grpMaterial"></div>
  <h3>Respiración</h3><div id="grpResp"></div>
  <h3>Crecimiento</h3><div id="grpCrec"></div>
  <h3>Aspecto</h3><div id="grpAsp"></div>
  <h3>Explosión</h3><div id="grpExp"></div>
  <div class="acciones">
    <button id="copiar">Copiar ajustes</button>
    <button id="reset">Restablecer</button>
  </div>
  <textarea id="jsonAjustes" readonly hidden aria-label="Ajustes en texto"></textarea>
</div>

<div id="inicio">

<script>
{
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let W = 0, H = 0;
const resize = () => {
  const d = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d;
  ctx.setTransform(d, 0, 0, d, 0, 0);
};
addEventListener('resize', resize); resize();

/* ---------- Ajustes (se guardan en el móvil) ---------- */
const DEF = { sens: 5, espera: 0.3, crecimiento: 140, tamMax: 0.42, solidez: 0, grosor: 1, brillo: 1, temblor: 1, gotas: 70, velGotas: 1, renacer: 0.7, color: null, fondo: '#050b18' };
let A = { ...DEF };
try { Object.assign(A, JSON.parse(localStorage.getItem('burbujaAjustes') || '{}')); } catch (e) {}
const guardar = () => { try { localStorage.setItem('burbujaAjustes', JSON.stringify(A)); } catch (e) {} };

const CONTROLES = {
  grpMaterial: [['solidez', 'Solidez (pompa → chicle)', 0, 1, 0.05, v => Math.round(v * 100) + '%'], ['grosor', 'Grosor del borde', 0.3, 3, 0.1, v => v.toFixed(1) + '×']],
  grpResp: [['sens', 'Sensibilidad del micro', 1, 10, 0.5, v => v.toFixed(1)], ['espera', 'Pausa antes de explotar', 0.1, 1.5, 0.05, v => v.toFixed(2) + ' s']],
  grpCrec: [['crecimiento', 'Velocidad de inflado', 40, 400, 10, v => Math.round(v)], ['tamMax', 'Tamaño máximo', 0.2, 0.48, 0.01, v => Math.round(v * 100) + '%']],
  grpAsp: [['brillo', 'Brillo y halo al soplar', 0, 2, 0.05, v => v.toFixed(2) + '×'], ['temblor', 'Temblor del borde', 0, 3, 0.1, v => v.toFixed(1) + '×']],
  grpExp: [['gotas', 'Cantidad de fragmentos', 10, 200, 5, v => Math.round(v)], ['velGotas', 'Fuerza de la explosión', 0.3, 2.5, 0.05, v => v.toFixed(2) + '×'], ['renacer', 'Tiempo hasta la nueva', 0.2, 3, 0.1, v => v.toFixed(1) + ' s']]
};
function pintarControles() {
  for (const [grp, lista] of Object.entries(CONTROLES)) {
    $(grp).innerHTML = lista.map(([k, l, mn, mx, st]) =>
      `<div class="ctrl"><label for="r_${k}">${l}</label><output id="o_${k}"></output><input id="r_${k}" type="range" min="${mn}" max="${mx}" step="${st}" value="${A[k]}"></div>`).join('');
    for (const [k, , , , , fmt] of lista) {
      const r = $('r_' + k), o = $('o_' + k);
      o.textContent = fmt(A[k]);
      r.addEventListener('input', () => { A[k] = +r.value; o.textContent = fmt(A[k]); guardar(); });
    }
  }
}

/* colores */
const hexAHue = hex => {
  const n = parseInt(hex.slice(1), 16), r = (n >> 16 & 255) / 255, g = (n >> 8 & 255) / 255, b = (n & 255) / 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  if (!d) return 200;
  const h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return (h * 60 + 360) % 360;
};
const hexARgb = hex => { const n = parseInt(hex.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const COL_B = [['Automático', null], ['Azul', 205], ['Turquesa', 172], ['Verde', 135], ['Oro', 45], ['Coral', 12], ['Chicle', 330], ['Violeta', 270]];
const COL_F = [['Noche', '#050b18'], ['Negro', '#000000'], ['Ciruela', '#1a0f1f'], ['Bosque', '#071a14'], ['Arena', '#efe6d8'], ['Blanco', '#f6f7fb'], ['Rosa', '#ffd9e6'], ['Cielo', '#cfe8ff']];
let fondoRGB = hexARgb(A.fondo), fondoClaro = false;
function aplicarFondo() {
  fondoRGB = hexARgb(A.fondo);
  const [r, g, b] = fondoRGB;
  fondoClaro = (0.299 * r + 0.587 * g + 0.114 * b) > 150;
  document.documentElement.classList.toggle('claro', fondoClaro);
  document.documentElement.style.setProperty('--panel', `rgba(${r},${g},${b},.93)`);
  document.body.style.background = A.fondo;
}
function pintarColores() {
  const marca = (cont, el) => { for (const b of cont.querySelectorAll('.sw')) b.setAttribute('aria-checked', b === el); };
  const sb = $('swBurbuja');
  sb.innerHTML = COL_B.map(([n, h]) => `<button class="sw${h === null ? ' auto' : ''}" role="radio" aria-label="${n}" data-h="${h ?? ''}" aria-checked="${A.color === h}" style="${h === null ? '' : `background:hsl(${h},80%,62%)`}"></button>`).join('')
    + `<span class="sw libre" role="radio" aria-label="Otro color" aria-checked="${A.color !== null && !COL_B.some(c => c[1] === A.color)}"><input type="color" value="#7fd8ff" aria-label="Otro color de burbuja"></span>`;
  for (const b of sb.querySelectorAll('button.sw')) b.onclick = () => { A.color = b.dataset.h === '' ? null : +b.dataset.h; marca(sb, b); if (A.color !== null) burbuja.hue = A.color; guardar(); };
  sb.querySelector('input').oninput = e => { const s = e.target.parentElement; s.style.background = e.target.value; A.color = hexAHue(e.target.value); burbuja.hue = A.color; marca(sb, s); guardar(); };
  const sf = $('swFondo');
  sf.innerHTML = COL_F.map(([n, c]) => `<button class="sw" role="radio" aria-label="${n}" data-c="${c}" aria-checked="${A.fondo === c}" style="background:${c}"></button>`).join('')
    + `<span class="sw libre" role="radio" aria-label="Otro fondo" aria-checked="${!COL_F.some(c => c[1] === A.fondo)}"><input type="color" value="${A.fondo}" aria-label="Otro color de fondo"></span>`;
  for (const b of sf.querySelectorAll('button.sw')) b.onclick = () => { A.fondo = b.dataset.c; marca(sf, b); aplicarFondo(); guardar(); };
  sf.querySelector('input').oninput = e => { const s = e.target.parentElement; s.style.background = e.target.value; A.fondo = e.target.value; marca(sf, s); aplicarFondo(); guardar(); };

    const k = Math.min(1, (estrellas.length - 12) / 140);
    cx.save(); cx.translate(W * 0.55, H * 0.24); cx.rotate(-0.42); cx.scale(1, 0.22);
    const vl = cx.createRadialGradient(0, 0, 0, 0, 0, W * 0.75);
    vl.addColorStop(0, rgba(ac, 0.07 * k)); vl.addColorStop(0.5, rgba(ac, 0.03 * k)); vl.addColorStop(1, rgba(ac, 0));
    cx.fillStyle = vl; cx.fillRect(-W, -W, W * 2, W * 2); cx.restore();
  }
  for (const e of estrellas) {                       // puntitos nítidos que titilan; las más grandes con destello fino
    const nac = Math.min(1, (t - e.nace) / 1.2), tw = 0.6 + 0.4 * Math.sin(t * e.f + e.ph);
    const c = e.tono < 0.45 ? [255, 255, 255] : e.tono < 0.85 ? lc : ac;
    const r = e.r;
    cx.globalAlpha = 0.16 * tw * nac; cx.fillStyle = rgba(ac, 1);
    cx.beginPath(); cx.arc(e.x, e.y, r * 2.4, 0, 6.3); cx.fill();
    cx.globalAlpha = (0.5 + 0.5 * tw) * nac; cx.fillStyle = rgba(c, 1);
    cx.beginPath(); cx.arc(e.x, e.y, r * 0.8, 0, 6.3); cx.fill();
    if (r > 1.85 * S) {
      const l = r * (3 + 2 * tw);
      cx.globalAlpha = 0.35 * tw * nac; cx.strokeStyle = rgba(c, 1); cx.lineWidth = 0.6 * S;
      cx.beginPath(); cx.moveTo(e.x - l, e.y); cx.lineTo(e.x + l, e.y); cx.moveTo(e.x, e.y - l); cx.lineTo(e.x, e.y + l); cx.stroke();
    }
    cx.globalAlpha = 1;
  }
  cx.lineCap = 'round'; cx.lineJoin = 'round';
  // tallo: curva que se dobla más arriba que abajo
  const nd = g.nodos;
  cx.beginPath(); cx.moveTo(nd[0][0], nd[0][1]);                      // un solo trazo: sin uniones visibles
  for (let i = 1; i < NS; i++) cx.quadraticCurveTo(nd[i][0], nd[i][1], (nd[i][0] + nd[i + 1][0]) / 2, (nd[i][1] + nd[i + 1][1]) / 2);
  cx.lineTo(nd[NS][0], nd[NS][1]);
  trazo(1.7 * S, 0.85, lc, true);
  // semillas pegadas: de atrás hacia delante, en tres capas de profundidad
  const crece = brotando ? brote : 1.8;
  const halo = spriteHalo(ac);
  for (const capa of [[-1.01, -0.33], [-0.33, 0.33], [0.33, 1.01]]) {
    const alfa = 0.3 + 0.7 * ((capa[0] + capa[1]) / 2 + 1) / 2;
    const picos = new Path2D(), sitios = [];
    cx.beginPath();
    for (let n = 0; n < semillas.length; n++) {
      const s = semillas[n];
      if (!s.pegada) continue;
      const [, , pz] = proyecta(s.v); if (pz < capa[0] || pz >= capa[1]) continue;
      const k = easeBack((crece - s.ret * 0.8) / 0.9); if (k <= 0) continue;
      const { A, P, C } = posSemilla(s, g, k);
      picos.moveTo(A[0], A[1]); picos.quadraticCurveTo(C[0], C[1], P[0], P[1]);
      const peina = (Math.max(0, aire) * 8 + s.prox * 26 * Math.max(0.3, aire) + s.vib * 22) * S;
      pappus(P[0], P[1], Math.atan2(P[1] - C[1], P[0] - C[0]), 36 * S * k, 9, 1.1, peina, -peina * 0.12, s.ret * 9, n);
      sitios.push(P[0], P[1], k);
    }
    cx.lineWidth = 0.5 * S; cx.strokeStyle = rgba(lc, alfa * 0.62); cx.stroke();
    cx.lineWidth = 0.4 * S; cx.strokeStyle = rgba(lc, alfa * 0.22); cx.stroke(picos);
    cx.globalAlpha = 0.13 * alfa;                                             // halos que se funden: volumen de algodón
    for (let q = 0; q < sitios.length; q += 3) { const r = 30 * S * sitios[q + 2]; cx.drawImage(halo, sitios[q] - r, sitios[q + 1] - r, r * 2, r * 2); }
    cx.globalAlpha = 1;
  }
  // receptáculo: cuando se van las semillas quedan los puntitos de unión
  cx.beginPath();
  for (const s of semillas) {
    if (s.pegada && !brotando) continue;
    const [px, py, pz] = proyecta(s.v); if (pz < -0.2) continue;
    const x = g.head[0] + px * 7 * S, y = g.head[1] + py * 7 * S;
    cx.moveTo(x + 1.1 * S, y); cx.arc(x, y, 1.1 * S, 0, 6.3);
  }
  cx.fillStyle = rgba(lc, 0.55); cx.fill();
  const rc = cx.createRadialGradient(g.head[0], g.head[1], 0, g.head[0], g.head[1], 9 * S);
  rc.addColorStop(0, rgba(lc, 0.95)); rc.addColorStop(1, rgba(ac, 0));
  cx.fillStyle = rc; cx.fillRect(g.head[0] - 10 * S, g.head[1] - 10 * S, 20 * S, 20 * S);
  // semillas en vuelo
  const picosV = new Path2D(); let glowLista = [];
  for (const p of vuelan) {
    let a = Math.min(1, p.edad / 0.3);
    if (modo === 'A') a *= 1 - Math.max(0, (p.edad - (p.vida - 2.8)) / 2.8);
    const m = p.estrella !== false ? ease(p.estrella) : 0;
    if (a <= 0.01) continue;
    const qx = 2 * p.mx - (p.ax + p.px) / 2, qy = 2 * p.my - (p.ay + p.py) / 2;   // curva que pasa por el punto medio
    const ang = Math.atan2(p.py - qy, p.px - qx);
    const sc = 1 / (1 + p.z);
    const Ax = p.px + (p.ax - p.px) * sc, Ay = p.py + (p.ay - p.py) * sc, Qx = p.px + (qx - p.px) * sc, Qy = p.py + (qy - p.py) * sc;
    if (p.len * (1 - m) > 0.5) {
      picosV.moveTo(Ax, Ay); picosV.quadraticCurveTo(Qx, Qy, p.px, p.py);
      const sdx = p.mx - p.ax, sdy = p.my - p.ay, sd = Math.hypot(sdx, sdy) || 1;
      picosV.moveTo(Ax, Ay); picosV.lineTo(Ax + sdx / sd * 6 * S * sc * (1 - m), Ay + sdy / sd * 6 * S * sc * (1 - m));
    }
    const vista = 0.3 + 0.7 * Math.abs(Math.cos(p.yaw));                      // perspectiva del disco al girar
    cx.beginPath();
    pappus(p.px, p.py, ang, 36 * S * sc * (1 - m * 0.85), 15, (1.35 * vista) * (1 - m * 0.85) + 0.05, p.rwx * 0.1, p.rwy * 0.1, p.ph, p.id);
    cx.lineWidth = 0.55 * S; cx.strokeStyle = rgba(lc, 0.85 * a); cx.stroke();
    glowLista.push([p.px, p.py, a, m]);
  }
  cx.lineWidth = 0.45 * S; cx.strokeStyle = rgba(lc, 0.35); cx.stroke(picosV);
  for (const [x, y, a, m] of glowLista) {     // corazón de luz de cada semilla; crece al volverse estrella
    const r = (5 - m * 3.6) * S, gr = cx.createRadialGradient(x, y, 0, x, y, r * 2.5);
    gr.addColorStop(0, rgba(lc, a * (0.16 + m * 0.7))); gr.addColorStop(0.35, rgba(ac, a * 0.12 * (1 + m))); gr.addColorStop(1, rgba(ac, 0));
    cx.fillStyle = gr; cx.fillRect(x - r * 2.5, y - r * 2.5, r * 5, r * 5);
  }
  cx.globalCompositeOperation = 'source-over';
}

let prev = performance.now();
function bucle(ahora) {
  const dt = Math.max(0, Math.min(1 / 30, (ahora - prev) / 1000)); prev = ahora;
  if (window.airExp === 'diente') { paso(dt); dibujar(); }
  requestAnimationFrame(bucle);
}
cv.addEventListener('pointerdown', () => tocando = true);
addEventListener('pointerup', () => tocando = false);
addEventListener('pointercancel', () => tocando = false);
$('expDiente').addEventListener('click', async () => {
  if (!(await window.airMicro('Diente de león'))) return;
  window.airExp = 'diente'; ajustar(); prev = performance.now();
  $('inicio').hidden = true; $('c').hidden = true; cv.hidden = false; $('hudD').hidden = false;
});
$('dMenu').onclick = () => { window.airExp = null; cv.hidden = true; $('hudD').hidden = true; $('c').hidden = false; $('inicio').hidden = false; };
$('dRecal').onclick = () => window.airRecal && window.airRecal();
function vistaDiente() { if (location.hash === '#diente') { window.airExp = 'diente'; ajustar(); $('inicio').hidden = true; $('c').hidden = true; cv.hidden = false; $('hudD').hidden = false; } }
addEventListener('hashchange', vistaDiente); vistaDiente();
requestAnimationFrame(bucle);
}

</script>
